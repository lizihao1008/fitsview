[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fitsview"
version = "0.2.0"
description = "Browser-based FITS structure viewer (headers, tables, spectra) with DS9 hand-off"
requires-python = ">=3.9"
dependencies = ["astropy>=5.0", "numpy", "flask>=2.2"]

[project.optional-dependencies]
desktop = ["pywebview>=5"]

[project.scripts]
fitsview = "fitsview.__main__:main"

[project.gui-scripts]
fitsview-desktop = "fitsview.desktop:main"

[tool.setuptools]
packages = ["fitsview"]

[tool.setuptools.package-data]
fitsview = ["static/*", "static/vendor/*"]
